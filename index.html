
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Can I Use It?</title>
<style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #eee; }
    .box { background: white; padding: 40px; border-radius: 15px; text-align: center; width: 400px; }
    select, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; font-size: 1rem; }
    button { background: #2c3e50; color: white; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
    <div class="box">
        <h1>Can I Use It?</h1>
        <select id="c" onchange="up()">
            <option value="">-- Cleaner --</option>
            <option value="Vinegar">Vinegar</option><option value="Bleach">Bleach</option><option value="Ammonia">Ammonia</option><option value="Acetone">Acetone</option><option value="Rubbing Alcohol">Rubbing Alcohol</option><option value="Boiling Water">Boiling Water</option><option value="Dish Soap">Dish Soap</option><option value="Magic Eraser">Magic Eraser</option><option value="WD-40">WD-40</option><option value="Baking Soda">Baking Soda</option><option value="Tap Water">Tap Water</option><option value="Windex">Windex</option>
        </select>
        <select id="s" disabled><option value="">-- Surface --</option></select>
        <button id="b" onclick="go()" disabled>Check Safety</button>
    </div>
    <script>
        const m = {"Vinegar": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Bleach": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Ammonia": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Acetone": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Rubbing Alcohol": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Boiling Water": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Dish Soap": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Magic Eraser": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "WD-40": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Baking Soda": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Tap Water": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"], "Windex": ["Granite Countertops", "Marble Floors", "Hardwood Floors (Sealed)", "iPhone Screen", "OLED TV", "Vinyl Siding", "Leather Seats", "Car Paint", "Stainless Steel", "Cast Iron Skillet", "Windows"]};
        function up() {
            const s = document.getElementById('s');
            const c = document.getElementById('c').value;
            s.innerHTML = '<option value="">-- Surface --</option>';
            if(c) {
                m[c].forEach(x => { let o = document.createElement('option'); o.value=x; o.text=x; s.add(o); });
                s.disabled = false;
            }
        }
        document.getElementById('s').onchange = function() { document.getElementById('b').disabled = !this.value; };
        function go() {
            const slug = (t) => t.toLowerCase().replace(/ /g, '-').replace(/[^\w-]+/g, '');
            window.location.href = slug(document.getElementById('c').value) + '-on-' + slug(document.getElementById('s').value) + '.html';
        }
    </script>
</body>
</html>
