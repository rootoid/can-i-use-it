
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can I Use It? - Material Compatibility Database</title>
    <meta name="description" content="Find out if it's safe to use cleaners on specific surfaces. Don't ruin your stuff. Check our database first.">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 500px; width: 100%; text-align: center; }
        h1 { margin-top: 0; color: #2c3e50; font-size: 2rem; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        select { width: 100%; padding: 15px; font-size: 16px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; cursor: pointer; appearance: none; }
        select:focus { border-color: #3498db; outline: none; }
        button { width: 100%; background: #2c3e50; color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #34495e; }
        .footer { margin-top: 20px; font-size: 0.8rem; color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Can I Use It?</h1>
        <p>Select a product and a surface to check compatibility.</p>
        
        <div class="form-group">
            <label for="cleaner">I want to use...</label>
            <select id="cleaner">
                <option value="Acetone">Acetone</option>
<option value="Ammonia">Ammonia</option>
<option value="Baby Wipes">Baby Wipes</option>
<option value="Baking Soda">Baking Soda</option>
<option value="Bleach">Bleach</option>
<option value="Boiling Water">Boiling Water</option>
<option value="Dish Soap">Dish Soap</option>
<option value="Goo Gone">Goo Gone</option>
<option value="Hand Sanitizer">Hand Sanitizer</option>
<option value="Hydrogen Peroxide">Hydrogen Peroxide</option>
<option value="Lemon Juice">Lemon Juice</option>
<option value="Magic Eraser">Magic Eraser</option>
<option value="Oven Cleaner">Oven Cleaner</option>
<option value="Paint Thinner">Paint Thinner</option>
<option value="Rubbing Alcohol">Rubbing Alcohol</option>
<option value="Steel Wool">Steel Wool</option>
<option value="Tap Water">Tap Water</option>
<option value="Vinegar">Vinegar</option>
<option value="WD-40">WD-40</option>
<option value="Windex">Windex</option>

            </select>
        </div>

        <div class="form-group">
            <label for="surface">On this surface...</label>
            <select id="surface">
                <option value="Aluminum">Aluminum</option>
<option value="Brass">Brass</option>
<option value="Car Paint">Car Paint</option>
<option value="Cast Iron">Cast Iron</option>
<option value="Concrete">Concrete</option>
<option value="Glass">Glass</option>
<option value="Gold Jewelry">Gold Jewelry</option>
<option value="Granite">Granite</option>
<option value="Leather">Leather</option>
<option value="Marble">Marble</option>
<option value="OLED TV">OLED TV</option>
<option value="Plastic (ABS)">Plastic (ABS)</option>
<option value="Rubber Seals">Rubber Seals</option>
<option value="Silver">Silver</option>
<option value="Stainless Steel">Stainless Steel</option>
<option value="Vinyl Siding">Vinyl Siding</option>
<option value="Wood Floor (Raw)">Wood Floor (Raw)</option>
<option value="Wood Floor (Sealed)">Wood Floor (Sealed)</option>
<option value="Wool Carpet">Wool Carpet</option>
<option value="iPhone Screen">iPhone Screen</option>

            </select>
        </div>

        <button onclick="checkCompatibility()">Check Safety</button>
        
        <div class="footer">
            Database contains 400 combinations.
        </div>
    </div>

    <script>
        function makeSlug(text) {
            return text.toLowerCase()
                       .replace(/\s+/g, '-')           // Replace spaces with -
                       .replace(/[^\w\-]+/g, '')       // Remove all non-word chars
                       .replace(/\-\-+/g, '-');        // Replace multiple - with single -
        }

        function checkCompatibility() {
            const cleaner = document.getElementById('cleaner').value;
            const surface = document.getElementById('surface').value;
            
            if(cleaner && surface) {
                const slug = makeSlug(cleaner) + '-on-' + makeSlug(surface) + '.html';
                window.location.href = slug;
            } else {
                alert("Please select both options!");
            }
        }
    </script>

</body>
</html>
